# Cloud Build: build the api and web images and deploy both to Cloud Run.
# Run: gcloud builds submit --config infra/cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD) .
# (A trigger on pushes to main can pass _TAG=$SHORT_SHA.)
substitutions:
  _REGION: us-central1
  _REPO: openlens
  _SERVICE: openlens-api
  _WEB_SERVICE: openlens-web
  _TAG: latest
  # Sizing and wire limits. Defaults match the live deployment; override for test projects to protect credit,
  # e.g. --substitutions=_TAG=x,_CPU=2,_MEMORY=4Gi,_DAILY_RUNS=10,_MAX_NEW=1,_AUTO_PUBLISH=all
  _CPU: "4"
  _MEMORY: 8Gi
  _DAILY_RUNS: "100"
  _MAX_NEW: "5"
  _MAX_UPDATES: "4"
  _CONCURRENCY: "5"
  _AUTO_PUBLISH: all
  # Realistic AI backdrops per video (about US$0.035 each + one Gemini call). 0 = off. GENAI cap is per instance.
  _ILLUSTRATIONS: "0"
  # Real licensed file photos (Wikimedia Commons, Gemini-verified, credited) per video, tried before AI backdrops. 0 = off.
  _PHOTOS: "0"
  # Public web URL: the end card QR / link points to <url>/story/<id>. Empty = placeholder.
  _PUBLIC_URL: ""
  # Locator map beat for the line that names a place (1 = on).
  _MAPS: "0"
  _GENAI_CAP: "3"
options:
  machineType: E2_HIGHCPU_8
steps:
  # --- api ---
  - id: api-build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/api/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}", "."]
  - id: api-push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}"]
  - id: api-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
      - --region=${_REGION}
      - --service-account=openlens-api@$PROJECT_ID.iam.gserviceaccount.com
      # Pipeline + video rendering run after the request returns, so CPU stays allocated.
      - --cpu=${_CPU}
      - --memory=${_MEMORY}
      - --timeout=3600
      - --no-cpu-throttling
      - --min-instances=0
      # One instance: the wire lock and in-flight pipeline set live in memory.
      - --max-instances=1
      - --concurrency=40
      - --allow-unauthenticated
      - --set-env-vars=STORE=firestore,AUTH_MODE=firebase,GEMINI_BACKEND=vertex,GOOGLE_CLOUD_LOCATION=global,ASSETS_BUCKET=$PROJECT_ID-openlens-media,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AUTO_PUBLISH=${_AUTO_PUBLISH},AUTO_MEDIA_LANGS=en,INGEST_DAILY_RUNS=${_DAILY_RUNS},INGEST_MAX_NEW=${_MAX_NEW},INGEST_MAX_UPDATES=${_MAX_UPDATES},INGEST_MAX_FETCH=60,INGEST_GDELT=0,INGEST_MAX_AGE_HOURS=24,INGEST_CONCURRENCY=${_CONCURRENCY},AUTO_ILLUSTRATIONS=${_ILLUSTRATIONS},AUTO_PHOTOS=${_PHOTOS},OPENLENS_PUBLIC_URL=${_PUBLIC_URL},AUTO_MAPS=${_MAPS},GENAI_SPEND_CAP_USD=${_GENAI_CAP},MEDIA_DATA_DIR=/tmp/openlens/genai
      - --set-secrets=INGEST_TOKEN=ingest-token:latest
  # --- web (needs the api URL at build time) ---
  - id: api-url
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args: ["-c", "gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(status.url)' > /workspace/api_url && cat /workspace/api_url"]
  - id: web-build
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ["-c", "docker build -f apps/web/Dockerfile --build-arg API_URL=$(cat /workspace/api_url) -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG} ."]
  - id: web-push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}"]
  - id: web-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
      - --region=${_REGION}
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=3
      - --allow-unauthenticated
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:${_TAG}
